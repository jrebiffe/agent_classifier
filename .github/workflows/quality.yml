name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev

      # Lint, format-check, type-check, static security, docstrings, secrets,
      # and file hygiene — all via the pre-commit hooks (single source of truth).
      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: deptry (dependency hygiene)
        run: uv run deptry .

      - name: pip-audit (dependency CVEs)
        run: uv run pip-audit --progress-spinner=off

      - name: tests
        run: uv run pytest
