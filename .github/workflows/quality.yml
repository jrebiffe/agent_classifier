name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      # Lint, format-check, type-check, static security, docstrings, secrets,
      # and file hygiene — all via the pre-commit hooks (single source of truth).
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: deptry (dependency hygiene)
        run: deptry .

      - name: pip-audit (dependency CVEs)
        run: pip-audit --progress-spinner=off

      - name: tests
        run: pytest
