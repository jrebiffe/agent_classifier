name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      # Lint, format-check, type-check, static security, docstrings, secrets,
      # and file hygiene — all via the pre-commit hooks (single source of truth).
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: deptry (dependency hygiene)
        run: deptry .

      - name: pip-audit (dependency CVEs)
        run: pip-audit --progress-spinner=off

      - name: tests
        run: pytest
