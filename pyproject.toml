[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-classifier"
version = "0.1.0"
description = "A DeepAgents-based Classifier that analyses AI agents and emits a structured classification."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "deepagents>=0.6,<0.7",
    "langchain>=1.3,<2",
    "langchain-core>=1.5,<2",
    "langchain-anthropic>=1.5,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "black>=24.8",
    "isort>=5.13",
    "flake8>=7.1",
    "flake8-pyproject>=1.2",
    "mypy>=1.11",
    "bandit>=1.7",
    "codespell>=2.3",
    "interrogate>=1.7",
    "deptry>=0.20",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "pre-commit>=3.8",
    "nox>=2024.4.15",
]

[project.scripts]
agent-classifier = "agent_classifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_classifier"]

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=agent_classifier --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["agent_classifier"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Ruff — primary linter. black owns formatting, isort owns imports, so ruff's
# formatter and its isort (I) rules stay off to avoid fighting them.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "UP", "SIM", "S", "RUF"]
# E501 (line length) is black's job; E203 is black-incompatible.
ignore = ["E501", "E203"]

[tool.ruff.lint.per-file-ignores]
# tests legitimately use asserts and dummy credentials.
"tests/**" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------------------
# Black — the single code formatter.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py311"]

# ---------------------------------------------------------------------------
# isort — the single import sorter (black-compatible).
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
known_first_party = ["agent_classifier"]

# ---------------------------------------------------------------------------
# flake8 — kept alongside ruff; reads this table via flake8-pyproject.
# ---------------------------------------------------------------------------
[tool.flake8]
max-line-length = 88
# E203/E501/W503 defer to black; the rest overlaps ruff intentionally.
extend-ignore = ["E203", "E501", "W503"]
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

# ---------------------------------------------------------------------------
# mypy — type checker, scoped to the package.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["deepagents.*", "langgraph.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# bandit — security scanner, kept alongside ruff's S rules.
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

# ---------------------------------------------------------------------------
# interrogate — docstring coverage for the package.
# ---------------------------------------------------------------------------
[tool.interrogate]
fail-under = 100
ignore-private = true
ignore-semiprivate = true
ignore-magic = true
ignore-nested-functions = true
exclude = ["tests", "noxfile.py"]

# ---------------------------------------------------------------------------
# deptry — dependency hygiene.
# ---------------------------------------------------------------------------
[tool.deptry]
known_first_party = ["agent_classifier"]
optional_dependencies_dev_groups = ["dev"]
# noxfile.py is dev tooling, not part of the shipped package.
extend_exclude = ["noxfile.py"]

[tool.deptry.per_rule_ignores]
# langchain-anthropic is loaded at runtime via init_chat_model, not imported.
DEP002 = ["langchain-anthropic"]

# ---------------------------------------------------------------------------
# codespell — typo checker.
# ---------------------------------------------------------------------------
[tool.codespell]
skip = "./.git,./.venv,./build,./dist,*.lock,./.secrets.baseline,./coverage.xml"
