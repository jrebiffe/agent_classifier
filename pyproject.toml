[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-classifier"
version = "0.1.0"
description = "A DeepAgents-based Classifier that analyses AI agents and emits a structured classification."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "deepagents>=0.6,<0.7",
    "langchain>=1.3,<2",
    "langchain-core>=1.5,<2",
    "langchain-anthropic>=1.5,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "black>=24.8",
    "isort>=5.13",
    "flake8>=7.1",
    "flake8-pyproject>=1.2",
    "mypy>=1.11",
    "bandit>=1.7",
    "codespell>=2.3",
    "interrogate>=1.7",
    "mdformat>=0.7",
    "mdformat-gfm>=0.3",
    "pymarkdownlnt>=0.9",
    "proselint>=0.13",
    "pydocstyle>=6.3",
    "deptry>=0.20",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "pre-commit>=3.8",
    "nox>=2024.4.15",
]

[project.scripts]
agent-classifier = "agent_classifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_classifier"]

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=agent_classifier --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["agent_classifier"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Ruff — primary linter AND formatter. isort owns imports; black stays as a
# --check-only verifier, so ruff format is the single rewriter alongside isort.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "B",             # flake8-bugbear
    "C4",            # flake8-comprehensions
    "C90",           # mccabe complexity
    "UP",            # pyupgrade (modern syntax)
    "FURB",          # refurb (modernisation)
    "SIM",           # flake8-simplify
    "RET",           # flake8-return
    "ARG",           # unused arguments
    "PTH",           # use pathlib
    "PT",            # flake8-pytest-style
    "TID",           # tidy imports
    "N",             # pep8-naming
    "PERF",          # perflint
    "PL",            # pylint
    "S",             # flake8-bandit
    "D",             # pydocstyle
    "RUF",           # ruff-specific
]
# E501 (line length) is black/ruff-format's job; E203 is formatter-incompatible;
# PLC0415 would flag our intentional lazy/deferred imports.
ignore = ["E501", "E203", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# tests use asserts, dummy creds, magic values, unused lambda args, and don't
# need docstrings (interrogate excludes them too).
"tests/**" = ["S101", "S105", "S106", "D", "ARG", "PLR2004", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Black — kept as a --check-only verifier of ruff format's output.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py313"]

# ---------------------------------------------------------------------------
# isort — the single import sorter (black/ruff-format compatible).
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
known_first_party = ["agent_classifier"]

# ---------------------------------------------------------------------------
# flake8 — kept alongside ruff; reads this table via flake8-pyproject.
# ---------------------------------------------------------------------------
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501", "W503"]
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

# ---------------------------------------------------------------------------
# mypy — strict type checking, scoped to the package.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["deepagents.*", "langgraph.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# bandit — security scanner, kept alongside ruff's S rules.
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

# ---------------------------------------------------------------------------
# pydocstyle — docstring conventions, kept alongside ruff's D rules. Invoked
# scoped to src/ (like bandit/mypy/interrogate), so no path excludes needed.
# ---------------------------------------------------------------------------
[tool.pydocstyle]
convention = "pep257"

# ---------------------------------------------------------------------------
# interrogate — docstring coverage for the package.
# ---------------------------------------------------------------------------
[tool.interrogate]
fail-under = 100
ignore-private = true
ignore-semiprivate = true
ignore-magic = true
ignore-nested-functions = true
exclude = ["tests", "noxfile.py"]

# ---------------------------------------------------------------------------
# deptry — dependency hygiene.
# ---------------------------------------------------------------------------
[tool.deptry]
known_first_party = ["agent_classifier"]
optional_dependencies_dev_groups = ["dev"]
# noxfile.py is dev tooling, not part of the shipped package.
extend_exclude = ["noxfile.py"]

[tool.deptry.per_rule_ignores]
# langchain-anthropic is loaded at runtime via init_chat_model, not imported.
DEP002 = ["langchain-anthropic"]

# ---------------------------------------------------------------------------
# codespell — typo checker.
# ---------------------------------------------------------------------------
[tool.codespell]
skip = "./.git,./.venv,./build,./dist,*.lock,./.secrets.baseline,./coverage.xml"
