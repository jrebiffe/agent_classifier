[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-classifier"
version = "0.1.0"
description = "A DeepAgents-based Classifier that analyses AI agents and emits a structured classification."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "deepagents>=0.6,<0.7",
    "langchain>=1.3,<2",
    "langchain-anthropic>=1.5,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-classifier = "agent_classifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_classifier"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
